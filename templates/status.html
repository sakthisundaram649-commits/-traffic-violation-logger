<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Challan Status #{{ record.id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h4>Challan Status</h4>
                        <p class="text-muted">Challan No. #{{ record.id }}</p>
                        <hr>
                        <table class="table table-sm text-start">
                            <tr><th>Vehicle Number</th><td>{{ record.vehicle_number }}</td></tr>
                            <tr><th>Violation</th><td>{{ record.violation_type }}</td></tr>
                            <tr><th>Location</th><td>{{ record.location }}</td></tr>
                            <tr><th>Date</th><td>{{ record.violation_date }}</td></tr>
                            <tr><th>Fine Amount</th><td>₹{{ '%.2f'|format(record.fine_amount) }}</td></tr>
                        </table>
                        <h5>
                            Status:
                            <span class="badge bg-{{ 'success' if record.status == 'Paid' else 'danger' }}">
                                {{ record.status }}
                            </span>
                        </h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
